<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Íñigo Muñoz · Backend Developer</title>
    <meta name="description" content="Backend Developer especializado en integraciones SAP y Business Central con e-commerce (PrestaShop, BigCommerce). PHP, Node.js y TypeScript. 100% remoto." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://inigo-munoz.netlify.app/" />
    <meta property="og:title" content="Íñigo Muñoz · Backend Developer" />
    <meta property="og:description" content="Integraciones SAP y Business Central con e-commerce. PHP, Node.js y TypeScript. 100% remoto." />
    <meta property="og:image" content="https://res.cloudinary.com/djersm2h6/image/upload/v1655478956/imagesportfolio/1645705689976_hujgkc.jpg" />
    <meta name="twitter:card" content="summary" />
    <link rel="stylesheet" href="%PUBLIC_URL%/css/default.css" />
    <link rel="stylesheet" href="%PUBLIC_URL%/css/layout.css" />
    <link rel="stylesheet" href="%PUBLIC_URL%/css/media-queries.css" />
    <link rel="stylesheet" href="%PUBLIC_URL%/css/magnific-popup.css" />

    <script src="%PUBLIC_URL%/js/modernizr.js"></script>
  </head>
  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->

    <script src="js/jquery-1.10.2.min.js"></script>
    <script
      type="text/javascript"
      src="js/jquery-migrate-1.2.1.min.js"
    ></script>
    <script src="js/jquery.flexslider.js"></script>
    <script src="js/waypoints.js"></script>
    <script src="js/jquery.fittext.js"></script>
    <script src="js/magnific-popup.js"></script>
    <script src="js/init.js"></script>
    <script>
      // Delegated so it also works for links React renders after this script runs.
      $(document).on("click", 'a[href^="#"]:not(.mobile-btn)', function (e) {
        var hash = this.hash;
        if (!hash || !$(hash).length) return;
        e.preventDefault();
        $("html, body").stop().animate({ scrollTop: $(hash).offset().top }, 800, function () {
          window.location.hash = hash;
        });
      });
    </script>
  </body>
</html>
